name: Fiji runtime

on:
  pull_request:
    paths:
      - "aNMJ-morph macro.txt"
      - "src/**"
      - "pom.xml"
      - "tests/runtime/**"
      - ".github/workflows/fiji-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-fiji-runtime:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache pinned Fiji archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\fiji-cache\fiji-win64-20260718.zip
          key: fiji-win64-20260718-5267fc8470c4f87c

      - name: Install pinned fresh Fiji
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'fiji-cache'
          $archive = Join-Path $cache 'fiji-win64-20260718.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'fiji-runtime'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null

          if (-not (Test-Path -LiteralPath $archive)) {
            curl.exe -L --fail --retry 3 `
              'https://downloads.imagej.net/fiji/archive/latest/20260718-0417/fiji-latest-win64-jdk.zip' `
              -o $archive
            if ($LASTEXITCODE -ne 0) { throw 'Fiji download failed' }
          }

          $expected = '5267fc8470c4f87cb948848898cc0dc62f74b69a78f3abf2a8643fe3a4af6c4a'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Fiji checksum mismatch: $actual"
          }

          if (Test-Path -LiteralPath $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $fijiRoot = Join-Path $extract 'Fiji'
          if (-not (Test-Path -LiteralPath (Join-Path $fijiRoot 'fiji-windows-x64.exe'))) {
            throw "Unexpected Fiji archive layout: $fijiRoot"
          }

          $morphologyDir = Join-Path $fijiRoot 'plugins\Morphology'
          $morphologyJar = Join-Path $morphologyDir 'morphology_collection.jar'
          New-Item -ItemType Directory -Force -Path $morphologyDir | Out-Null
          curl.exe -L --fail --retry 3 `
            'https://sites.imagej.net/Landini/plugins/Morphology/morphology_collection.jar-20210426003655' `
            -o $morphologyJar
          if ($LASTEXITCODE -ne 0) { throw 'Morphology plugin download failed' }

          $expectedMorphology = '694de653a7e79c52eec3b7a47f75414d93cb317b4f6402d3c8fba05d255e0b7c'
          $actualMorphology = (Get-FileHash -Algorithm SHA256 -LiteralPath $morphologyJar).Hash.ToLowerInvariant()
          if ($actualMorphology -ne $expectedMorphology) {
            throw "Morphology plugin checksum mismatch: $actualMorphology"
          }

          "FIJI_ROOT=$fijiRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Java plugin
        run: mvn -B -ntp -DskipTests package

      - name: Smoke-test Java plugin against fresh Fiji
        shell: powershell
        run: |
          $jar = Get-ChildItem -LiteralPath .\target -Filter 'anmj-morph-plus-*.jar' |
            Where-Object { $_.Name -notlike '*-sources.jar' -and $_.Name -notlike '*-javadoc.jar' } |
            Select-Object -First 1
          if (-not $jar) { throw 'Could not find built aNMJ-morph+ plugin JAR' }
          .\tests\runtime\run_java_plugin_smoke.ps1 -FijiRoot $env:FIJI_ROOT -PluginJar $jar.FullName

      - name: Run fixture matrix and regression workflows
        shell: powershell
        run: |
          .\tests\runtime\run_validation.ps1 -FijiRoot $env:FIJI_ROOT -Runs 2 -TimeoutSeconds 180

      - name: Upload runtime outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-runtime-failure
          path: tests/runtime/_work/
          if-no-files-found: ignore
