name: Fiji runtime

on:
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - "src/test/resources/NMJ_1.lsm"
      - ".github/workflows/fiji-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-fiji:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\fiji-cache\fiji-win64-20260718.zip
          key: fiji-win64-20260718-5267fc8470c4f87c

      - name: Install pinned Fiji
        shell: bash
        run: |
          set -euo pipefail
          temp="${RUNNER_TEMP//\\//}"
          cache="$temp/fiji-cache"
          archive="$cache/fiji-win64-20260718.zip"
          extract="$temp/fiji-runtime"
          mkdir -p "$cache"
          if [[ ! -f "$archive" ]]; then
            curl -L --fail --retry 3 \
              https://downloads.imagej.net/fiji/archive/latest/20260718-0417/fiji-latest-win64-jdk.zip \
              -o "$archive"
          fi
          echo "5267fc8470c4f87cb948848898cc0dc62f74b69a78f3abf2a8643fe3a4af6c4a *$archive" | sha256sum -c -
          rm -rf "$extract"
          mkdir -p "$extract"
          7z x -y "$archive" "-o$extract" >/dev/null
          [[ -f "$extract/Fiji/fiji-windows-x64.exe" ]]
          echo "FIJI_ROOT=$extract/Fiji" >> "$GITHUB_ENV"

      - name: Run Java-only scientific oracle against pinned Fiji
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp package -Dmaven.test.skip=true
          plugin="$(find target -maxdepth 1 -name 'anmj-morph-plus-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-tests.jar' -print -quit)"
          [[ -n "$plugin" ]]
          work="${RUNNER_TEMP//\\//}/anmj-runtime"
          rm -rf "$work"
          mkdir -p "$work/classes"
          cp "$plugin" "$FIJI_ROOT/plugins/anmj-morph-plus-runtime.jar"

          java_bin="$(find "$FIJI_ROOT/java/win64" -type f -name java.exe -print -quit)"
          javac_bin="$(find "$FIJI_ROOT/java/win64" -type f -name javac.exe -print -quit)"
          [[ -n "$java_bin" && -n "$javac_bin" ]]
          winpath() { cygpath -am "$1"; }
          fiji_win="$(winpath "$FIJI_ROOT")"
          classes_win="$(winpath "$work/classes")"
          cp="$classes_win;$fiji_win/jars/*"
          while IFS= read -r dir; do cp="$cp;$(winpath "$dir")/*"; done \
            < <(find "$FIJI_ROOT/plugins" -type f -name '*.jar' -printf '%h\n' | sort -u)

          "$javac_bin" -proc:none -cp "$cp" -d "$classes_win" \
            "$(winpath "src/test/java/io/github/alzeiby/anmjmorphplus/FreshFijiRuntime.java")"
          "$java_bin" -Dplugins.dir="$fiji_win" -Djava.awt.headless=false -cp "$cp" \
            io.github.alzeiby.anmjmorphplus.FreshFijiRuntime \
            "$(winpath "src/test/resources/NMJ_1.lsm")" "$(winpath "$work")" 2

      - name: Upload outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-runtime-failure
          path: ${{ runner.temp }}\anmj-runtime
          if-no-files-found: ignore
