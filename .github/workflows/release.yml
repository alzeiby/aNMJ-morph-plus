name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python tests/repository_checks.py

      - name: Build release archive
        run: bash scripts/package_release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          package="aNMJ-morph-plus-${version}"
          gh release create "${version}" \
            "dist/${package}.zip" \
            "dist/${package}.zip.sha256" \
            --generate-notes \
            --title "${version}"
