name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp verify
      - name: Keep auxiliary code out
        run: |
          test -z "$(git ls-files '*.py' '*.ps1' 'tests/**' 'scripts/**' 'src/test/java/**')"
          test ! -e "aNMJ-morph macro.txt"
      - name: Check changed-file whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "$(git merge-base HEAD origin/${{ github.base_ref }})" HEAD
      - name: Smoke-test release package
        run: |
          set -euo pipefail
          package="aNMJ-morph-plus-ci-smoke"
          mkdir -p "dist/$package"
          cp LICENSE CITATION.cff README.md "dist/$package/"
          jar="$(find target -maxdepth 1 -name 'anmj-morph-plus-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-tests.jar' -print -quit)"
          test -n "$jar"
          cp "$jar" "dist/$package/aNMJ-morph-plus.jar"
          (cd dist && zip -qr "$package.zip" "$package" && sha256sum "$package.zip" > "$package.zip.sha256" && sha256sum -c "$package.zip.sha256")
          unzip -l "dist/$package.zip" | grep -q 'aNMJ-morph-plus.jar'
