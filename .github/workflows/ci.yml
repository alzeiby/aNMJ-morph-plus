name: CI

on:
  push:
    branches:
      - main
      - fix/**
      - docs/**
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile repository checks
        run: python -m py_compile tests/repository_checks.py

      - name: Run repository checks
        run: python tests/repository_checks.py

      - name: Check whitespace errors
        run: git diff --check HEAD~1 HEAD
